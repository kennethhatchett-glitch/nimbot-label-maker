# Builds the Android app (.apk) and publishes it as a GitHub Release,
# so it can be downloaded and installed straight from a phone.
name: Build app

on:
  push:
    branches: ["**"]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "third_party/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Reuse the same signing key for every build, so a new version of
      # the app can be installed over the old one without uninstalling.
      # (GitHub drops a saved cache after 7 days without any builds; then
      # a new key is made and the app must be uninstalled once.)
      - name: Reuse signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Generate the standard Android project files, then add our code.
      - name: Create Android project
        run: |
          flutter create --org com.labelprinter --project-name label_printer --platforms android build_app
          cp -r lib third_party pubspec.yaml build_app/
          cd build_app
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          s = open(path).read()
          s = s.replace('android:label="label_printer"', 'android:label="Label Printer"')
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />',
              '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />',
          ]
          s = s.replace("<application", "\n    ".join(perms) + "\n    <application", 1)
          service = ('<service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" '
                     'android:foregroundServiceType="connectedDevice" '
                     'android:stopWithTask="true" android:exported="false" />')
          s = s.replace("</application>", "    " + service + "\n    </application>", 1)
          open(path, "w").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../label-printer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Label Printer test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: label-printer.apk
          body: |
            Test build of the Label Printer app.
            On your phone, tap **label-printer.apk** below to download, then open it to install.
